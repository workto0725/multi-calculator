<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="멀티계산기"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>멀티 금융 계산기</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#17191d}*{box-sizing:border-box}main{max-width:1000px;margin:auto;padding:14px}.tabs,.row,.send{display:flex;gap:7px;flex-wrap:wrap}button,input,select{font:inherit}button{min-height:44px;border:1px solid #ddd;background:#fff;border-radius:10px;padding:7px 11px}.on,.primary{background:#2563eb;color:white;border-color:#2563eb}.tabs button{flex:1}.pane{display:none;margin-top:12px}.pane.on{display:block}.card,.calc{background:white;border:1px solid #ddd;border-radius:16px;padding:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.screen{background:#f7f8fa;border-radius:12px;padding:10px;text-align:right;margin:8px 0}.expr{font-size:12px;color:#777;min-height:18px}.display{font-size:28px;font-weight:800}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.keys button{font-weight:700}.op{background:#eaf1ff}.calc input{width:100%;border:0;border-bottom:1px solid #ddd;padding:7px;font-weight:700}.card label{display:block;margin:10px 0;font-weight:650}.card input,.card select{width:100%;min-height:44px;border:1px solid #ddd;border-radius:10px;padding:8px;margin-top:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{width:100%;margin-top:8px}.result{background:#f7f8fa;border-radius:12px;padding:12px;margin-top:10px;line-height:1.7}.big{font-size:21px;font-weight:800}.note{font-size:12px;color:#777;margin-top:8px}.history{font-size:12px;color:#777;margin-top:8px;max-height:80px;overflow:auto}@media(max-width:650px){.grid,.two{grid-template-columns:1fr}.tabs button{font-size:12px;padding:5px}}</style></head><body><main><h2>멀티 금융 계산기</h2><div class="tabs"><button class="tab on" data-p="multi">🧮 멀티</button><button class="tab" data-p="saving">💰 예·적금</button><button class="tab" data-p="fx">💱 환율</button><button class="tab" data-p="loan">🏦 대출</button></div>
<section id="multi" class="pane on"><div class="card"><b>계산기 개수</b><div class="row" id="counts"><button data-n="1">1개</button><button class="on" data-n="2">2개</button><button data-n="3">3개</button><button data-n="4">4개</button></div></div><div id="grid" class="grid" style="margin-top:10px"></div></section>
<section id="saving" class="pane"><div class="card"><div class="row"><button id="dep" class="on">예금</button><button id="ins">적금</button></div><label><span id="amtLabel">예치 금액</span><input id="sAmt" inputmode="numeric"></label><div class="two"><label>연 이율 (%)<input id="sRate" inputmode="decimal"></label><label>기간 (개월)<input id="sMon" inputmode="numeric"></label></div><label><input id="taxFree" type="checkbox" style="width:auto;min-height:auto"> 비과세</label><button id="sGo" class="primary">계산하기</button><div id="sOut" class="result">값을 입력하세요.</div><div id="sSend" class="send"></div><div class="note">일반과세는 이자소득세 15.4%를 단순 적용합니다.</div></div></section>
<section id="fx" class="pane"><div class="card"><div class="two"><label>기준 통화<select id="from"><option>KRW</option><option>USD</option><option>JPY</option><option>EUR</option><option>CNY</option></select></label><label>변환 통화<select id="to"><option>USD</option><option>KRW</option><option>JPY</option><option>EUR</option><option>CNY</option></select></label></div><label>금액<input id="fAmt" inputmode="decimal"></label><label>환율 (기준통화 1당 변환통화)<input id="fRate" inputmode="decimal" placeholder="직접 입력"></label><button id="fGo" class="primary">환산하기</button><div id="fOut" class="result">금액과 환율을 입력하세요.</div><div id="fSend" class="send"></div><div class="note">이 파일은 직접 환율 입력 방식입니다. 실제 환전액은 은행·카드 수수료에 따라 달라질 수 있습니다.</div></div></section>
<section id="loan" class="pane"><div class="card"><label>대출 금액<input id="lAmt" inputmode="numeric"></label><div class="two"><label>연 이율 (%)<input id="lRate" inputmode="decimal"></label><label>기간 (개월)<input id="lMon" inputmode="numeric"></label></div><label>상환 방식<select id="lType"><option value="equal">원리금균등</option><option value="principal">원금균등</option><option value="bullet">만기일시상환</option></select></label><button id="lGo" class="primary">계산하기</button><div id="lOut" class="result">값을 입력하세요.</div><div id="lSend" class="send"></div></div></section>
<script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K='mfc1';let S={n:2,c:Array.from({length:4},(_,i)=>({name:'계산기 '+String.fromCharCode(65+i),e:'',v:0,h:[]}))};try{S=JSON.parse(localStorage.getItem(K))||S}catch{}const save=()=>localStorage.setItem(K,JSON.stringify(S)),F=n=>Number(n.toFixed(10)).toLocaleString('ko-KR',{maximumFractionDigits:10}),W=n=>Math.round(n).toLocaleString('ko-KR')+'원',N=id=>Number(($(id).value||'').replace(/,/g,''));function E(x){if(!x)return null;x=x.replace(/×/g,'*').replace(/÷/g,'/');if(!/^[0-9+\-*/. ]+$/.test(x))return null;try{let v=Function('return ('+x+')')();return Number.isFinite(v)?v:null}catch{return null}}$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');$$('.pane').forEach(x=>x.classList.remove('on'));$('#'+b.dataset.p).classList.add('on')});function draw(){let g=$('#grid');g.innerHTML='';for(let i=0;i<S.n;i++){let s=S.c[i],d=document.createElement('div');d.className='calc';d.dataset.i=i;let tr='';for(let j=0;j<S.n;j++)if(i!==j)tr+=`<button data-from="${j}">${String.fromCharCode(65+j)} 결과</button>`;d.innerHTML=`<input class="name" value="${s.name}"><div class="screen"><div class="expr">${s.e||'계산식을 입력하세요'}</div><div class="display">${F(s.v)}</div></div><div class="send">${tr}</div><div class="keys">${['AC','⌫','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','00','.','='].map(k=>`<button data-k="${k}" class="${'+-×÷='.includes(k)?'op':''}">${k}</button>`).join('')}</div><div class="history">${s.h.slice(0,5).join('<br>')||'계산 기록 없음'}</div>`;g.appendChild(d)}save()}$('#counts').onclick=e=>{let b=e.target.closest('button');if(!b)return;S.n=+b.dataset.n;$('#counts').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw()};$('#grid').oninput=e=>{if(e.target.classList.contains('name')){S.c[+e.target.closest('.calc').dataset.i].name=e.target.value;save()}};$('#grid').onclick=e=>{let b=e.target.closest('button'),c=b?.closest('.calc');if(!b||!c)return;let s=S.c[+c.dataset.i];if(b.dataset.from!==undefined){let v=S.c[+b.dataset.from].v;if(s.e&&!/[+\-×÷]$/.test(s.e))s.e+='+';s.e+=v;s.v=E(s.e)??v;draw();return}let k=b.dataset.k;if(k==='AC'){s.e='';s.v=0}else if(k==='⌫'){s.e=s.e.slice(0,-1);s.v=E(s.e)??0}else if(k==='='){let v=E(s.e);if(v!==null){s.h.unshift(s.e+' = '+F(v));s.v=v;s.e=String(v)}}else if(k==='%'){let v=E(s.e);if(v!==null){s.v=v/100;s.e=String(s.v)}}else{s.e+=k;let v=E(s.e);if(v!==null)s.v=v}draw()};function sends(id,get){let e=$(id);e.innerHTML='';for(let i=0;i<S.n;i++){let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'로 보내기';b.onclick=()=>{let v=get();if(Number.isFinite(v)){S.c[i].e=String(v);S.c[i].v=v;save();b.textContent='보냄 ✓'}};e.appendChild(b)}}let st='dep',lastS=null;$('#dep').onclick=()=>{st='dep';$('#dep').classList.add('on');$('#ins').classList.remove('on');$('#amtLabel').textContent='예치 금액'};$('#ins').onclick=()=>{st='ins';$('#ins').classList.add('on');$('#dep').classList.remove('on');$('#amtLabel').textContent='월 납입액'};$('#sGo').onclick=()=>{let a=N('#sAmt'),r=N('#sRate')/100,m=N('#sMon');if(!(a>0&&r>=0&&m>0))return $('#sOut').textContent='올바른 값을 입력하세요.';let p,i;if(st==='dep'){p=a;i=a*r*m/12}else{p=a*m;i=0;for(let x=0;x<m;x++)i+=a*r*(m-x)/12}let tax=$('#taxFree').checked?0:i*.154;lastS=p+i-tax;$('#sOut').innerHTML=`<div class="big">만기 예상 ${W(lastS)}</div>원금 ${W(p)}<br>세전 이자 ${W(i)}<br>세후 이자 ${W(i-tax)}`;sends('#sSend',()=>lastS)};let lastF=null;$('#fGo').onclick=()=>{let a=N('#fAmt'),r=N('#fRate');if(!(a>=0&&r>0))return $('#fOut').textContent='올바른 값을 입력하세요.';lastF=a*r;$('#fOut').innerHTML=`<div class="big">${F(lastF)} ${$('#to').value}</div>`;sends('#fSend',()=>lastF)};let lastL=null;$('#lGo').onclick=()=>{let p=N('#lAmt'),ar=N('#lRate')/100,n=N('#lMon'),t=$('#lType').value;if(!(p>0&&ar>=0&&n>0))return $('#lOut').textContent='올바른 값을 입력하세요.';let mr=ar/12,first,ti,total;if(t==='equal'){let pay=mr? p*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1):p/n;first=pay;total=pay*n;ti=total-p}else if(t==='principal'){first=p/n+p*mr;ti=(p/n)*mr*n*(n+1)/2;total=p+ti}else{first=p*mr;ti=p*mr*n;total=p+ti}lastL=total;$('#lOut').innerHTML=`<div class="big">월/첫 납입 약 ${W(first)}</div>총 이자 ${W(ti)}<br>총 상환액 ${W(total)}`;sends('#lSend',()=>lastL)};draw();$('#counts').querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.n===S.n));</script></main></body></html>
